<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Вход</title></head>
<body>
<h1>Вход</h1>
<p th:if="${param.error}">Неверный email или пароль</p>
<p th:if="${param.logout}">Вы вышли из системы</p>
<p th:if="${param.registered}">Регистрация прошла успешно, войдите</p>
<form th:action="@{/login}" method="post">
    <div><label>Email: <input type="text" name="username"></label></div>
    <div><label>Пароль: <input type="password" name="password"></label></div>
    <button type="submit">Войти</button>
</form>
<a th:href="@{/register}">Регистрация</a>
</body>
</html>
