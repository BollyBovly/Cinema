<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Регистрация</title></head>
<body>
<h1>Регистрация</h1>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<form th:action="@{/register}" method="post">
    <div><label>Имя: <input type="text" name="firstName" th:value="${firstName}"></label></div>
    <div><label>Фамилия: <input type="text" name="surname" th:value="${surname}"></label></div>
    <div><label>Email: <input type="text" name="email" th:value="${email}"></label></div>
    <div><label>Город: <input type="text" name="city" th:value="${city}"></label></div>
    <div><label>Пароль: <input type="password" name="password"></label></div>
    <button type="submit">Зарегистрироваться</button>
</form>
<a th:href="@{/login}">Уже есть аккаунт</a>
</body>
</html>
